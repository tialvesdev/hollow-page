# Blueprint do Render: um único serviço web (API + front). Banco no Neon e imagens no Cloudflare R2.
services:
  - type: web
    name: hollow-page
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # URL com pooler do Neon (host com -pooler)
        sync: false
      - key: DATABASE_URL_UNPOOLED # URL direta do Neon, usada nas migrações
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
